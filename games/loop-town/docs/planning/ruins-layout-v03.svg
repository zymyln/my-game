<text x="1415" y="935" font-size="23" fill="#33443e" font-weight="bold">仍然保留的边界</text>
<text x="1415" y="975" font-size="17" fill="#33443e" font-weight="normal">只有最终封印中心位置已定</text>
<text x="1415" y="1005" font-size="17" fill="#33443e" font-weight="normal">P1 / P2 落点、具体机关待定</text>
<text x="1415" y="1035" font-size="17" fill="#33443e" font-weight="normal">不把屏障当成永久锁门规则</text>
<text x="1415" y="1065" font-size="17" fill="#33443e" font-weight="normal">古代魔女身份与年代待定</text>
<text x="1415" y="1095" font-size="17" fill="#33443e" font-weight="normal">S1 / S3 不默认连通</text>
<text x="1415" y="1125" font-size="17" fill="#33443e" font-weight="normal">所有空间仍在结界封锁内</text>
<text x="1415" y="1155" font-size="17" fill="#33443e" font-weight="normal">不新增战斗、潜行或跳跃系统</text>
<text x="45" y="1324" font-size="21" fill="#33443e" font-weight="bold">探索节奏：主入口 → 看见中心轮廓 → 分翼调查与解谜 → 回廊回访 → 第五天接近中心。</text>
<text x="45" y="1364" font-size="18" fill="#33443e" font-weight="normal">密度来自可辨用途、局部操作、线索关联与回访；古代遗迹的破损为原有状态，不是循环导致每日腐坏。</text>
<text x="45" y="1400" font-size="18" fill="#33443e" font-weight="normal">本图是空间提案，非比例关卡：尚未验证碰撞、步行时间、遮挡视线、跨层投影；决战场地不在本轮定稿。</text>
<text x="45" y="1436" font-size="18" fill="#68746c" font-weight="normal">地面配套小镇第三稿，M1 / R01 为同一候选跨图接口，两图不作精确投影。R 编号不映射旧 U 编号或正式事件 ID。</text>
