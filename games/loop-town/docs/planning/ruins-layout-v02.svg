<text x="504" y="955" font-size="18" fill="#81572d" font-weight="bold">U13 地下遗迹中心 · 最终封印</text>
<text x="504" y="983" font-size="14" fill="#33413e" font-weight="normal">第 5 天显现：企划已定；此前表现为普通中心遗构的候选</text>
<text x="504" y="1006" font-size="14" fill="#33413e" font-weight="normal">留前庭、跟踪视线、出手距离与两人合作位置；不定分镜</text>
