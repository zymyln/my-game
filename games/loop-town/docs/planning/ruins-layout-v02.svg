<text x="1030" y="975" font-size="15" fill="#33413e" font-weight="normal">决战场地待定</text>
<text x="1030" y="1005" font-size="15" fill="#33413e" font-weight="normal">不自动通向镇外</text>
<text x="410" y="372" font-size="16" fill="#33413e" font-weight="normal">上层回廊：入口分流与方位辨认</text>
<text x="405" y="695" font-size="16" fill="#33413e" font-weight="normal">维护环路：绕过中心，连接调查与解谜支翼</text>
<text x="790" y="902" font-size="15" fill="#33413e" font-weight="normal">下行前庭（高差与遮挡待细化）</text>
<text x="1275" y="145" font-size="21" fill="#324c42" font-weight="bold">空间阅读顺序</text>
<text x="1275" y="185" font-size="16" fill="#33413e" font-weight="normal">01 日常地下设施</text>
<text x="1275" y="215" font-size="16" fill="#33413e" font-weight="normal">02 古老结构与用途</text>
<text x="1275" y="245" font-size="16" fill="#33413e" font-weight="normal">03 后期改造的痕迹</text>
<text x="1275" y="275" font-size="16" fill="#33413e" font-weight="normal">04 封印与中心异常</text>
<text x="1275" y="305" font-size="16" fill="#33413e" font-weight="normal">这些是提案层次</text>
<text x="1275" y="335" font-size="16" fill="#33413e" font-weight="normal">不预设遗迹起源</text>
<text x="1275" y="425" font-size="21" fill="#324c42" font-weight="bold">探索节奏</text>
<text x="1275" y="465" font-size="16" fill="#33413e" font-weight="normal">前室 → 回廊 → 支翼</text>
<text x="1275" y="495" font-size="16" fill="#33413e" font-weight="normal">可见目标，绕行调查</text>
<text x="1275" y="525" font-size="16" fill="#33413e" font-weight="normal">尽端有可选信息回报</text>
<text x="1275" y="555" font-size="16" fill="#33413e" font-weight="normal">中心有独立接近前庭</text>
<text x="1275" y="585" font-size="16" fill="#33413e" font-weight="normal">沿途有短暂安静空间</text>
<text x="1275" y="675" font-size="21" fill="#324c42" font-weight="bold">线型与规则</text>
<text x="1275" y="715" font-size="16" fill="#33413e" font-weight="normal">粗实线：内部候选通路</text>
<text x="1275" y="745" font-size="16" fill="#33413e" font-weight="normal">红虚线：待定跨图接口</text>
<text x="1275" y="775" font-size="16" fill="#33413e" font-weight="normal">P1 / P2：封印位置提案</text>
<text x="1275" y="805" font-size="16" fill="#33413e" font-weight="normal">图中连接整体待确认</text>
<text x="1275" y="835" font-size="16" fill="#33413e" font-weight="normal">不包含出镇逃生通道</text>
<text x="1275" y="925" font-size="21" fill="#984a55" font-weight="bold">本轮只验证结构</text>
<text x="1275" y="965" font-size="16" fill="#33413e" font-weight="normal">不制作室内像素地图</text>
<text x="1275" y="995" font-size="16" fill="#33413e" font-weight="normal">不确定具体机关答案</text>
<text x="1275" y="1025" font-size="16" fill="#33413e" font-weight="normal">不确定剧情揭露顺序</text>
<text x="45" y="1135" font-size="16" fill="#33413e" font-weight="normal">五天对应：D1 B1 / D2 P1 / D3 B2 / D4 P2 / D5 中心最终封印；只有时间线已定，地点均属候选。</text>
<text x="45" y="1165" font-size="16" fill="#33413e" font-weight="normal">重要：遗迹与普通地下设施是否采用同一网络、三个入口是否保留，都需用户确认；这张图是一种可讨论的方案。</text>
