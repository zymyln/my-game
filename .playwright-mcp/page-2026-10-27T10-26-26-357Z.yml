                                                                            - generic: 请直接生成《循环小镇》旧城区普通老爷爷NPC的正面静止像素小人。上传图是同游戏的面包店老板，仅参考像素颗粒、Q版大头短身比例、轻微俯视视角、画风和站姿；不要复制人物的脸、发型、厨师帽或围裙。 设计候选：一位普通的老年镇民，稀疏灰白短发、少量灰白胡须，穿褪色的灰褐色旧外套、米灰衬衣、暗棕长裤和旧鞋；衣服有轻微磨损与一两块可辨认的旧补丁，整洁但明显穿了许多年。低调自然的旧城生活感，不画成乞丐或夸张悲惨角色；不加商贩职业装。年龄主要通过灰发和轮廓体现，简洁色块便于游戏小尺寸识别。单人全身正面安静站立，双手自然垂放、双脚着地，角色四周留白，透明背景；不画环境、拐杖、柜台、文字、边框、阴影、其他人物或其他方向。
