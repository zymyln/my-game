                                                                          - generic:
                                                                            - generic: 请直接生成一张《循环小镇》布店外观的像素美术设计参考图，供后续游戏美术与程序制作建筑素材。图1是已有面包店与木工铺的游戏素材对照，只参考斜俯视地图视角、建筑和门窗比例、像素颗粒与材质；图2是杂货铺设计候选，参考同一小镇风格，但布店的建筑轮廓、展示方式和配色要明显不同，不照搬杂货铺的整面长条遮阳棚或篮子招牌。 结构必须清楚：画面左半是一间完整的布店房屋，有屋顶、正面入口和窗户；画面右半是紧邻房屋的布匹售卖展示区，采用轻巧的木架或敞开式廊架，陈列几卷竖放布匹、整齐折叠的布料和悬挂的布样，让人一眼辨认布店。右侧保持可见的商品展示和顾客接近空间，不要把整座建筑做成只有屋顶与门的普通住宅。屋顶外形、墙面装饰和柔和色彩区别于木工铺及杂货铺，但仍属于同一座普通奇幻小镇；入口、货架、布卷等结构彼此清楚分开，方便后续拆分。 展示单个完整建筑和右侧陈列区域，横版、周围留白；保持游戏斜俯视视角和清晰像素游戏画风。不要人物、文字、UI、标尺、边框、多视图或水印。只生成一张外观设计参考图。
