                                                                            - generic: 请直接生成一张《循环小镇》游戏铁匠铺的像素美术设计稿，供后续程序和美术人员参考制作地图素材。上传图是现有面包店的游戏截图：只参考地图的俯视角度、建筑与角色比例、像素颗粒、色彩、光影、屋顶和墙面表现，不复制截图的界面、文字、玩家或面包招牌。 设计一座普通小镇铁匠铺外观：一栋适合与面包店同街并排的中小型建筑，完整可见连贯屋顶、清楚的正面入口与窗户，使用木梁、石材、深色金属和低饱和暖灰棕色；一侧带砖石炉膛与烟囱，屋外安排铁砧、少量工具与木箱，铁砧或铁锤形状的无文字招牌。布局清晰实用，炉膛和工具是设计候选，物件分离、不遮住门口，便于后续拆分素材。保持与参考截图相同的斜俯视地图角度和细致像素游戏风格，不画成平视建筑立绘、写实插画或等距地图。 画面展示单个完整建筑及紧贴建筑的小型工作区，周围留足空白，可用简洁地面衬托结构；不要人物、说明文字、标尺、UI、拼图、多视图、边框或水印。只生成一张设计参考图，不要当作已经可直接使用的瓦片素材。
