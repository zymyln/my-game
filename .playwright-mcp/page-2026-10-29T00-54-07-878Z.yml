                                                                        - generic:
                                                                          - generic:
                                                                            - generic: 请直接生成一张《循环小镇》杂货铺重设计的像素美术参考图，供程序端后续制作游戏建筑与可拆分场景素材。图1是目前杂货铺游戏截图，参考这个游戏的斜俯视视角、人物及门窗比例、像素颗粒和画风；图2是现有面包店与新木工铺对照，参考同一游戏的材质与像素风格，并避免让杂货铺轮廓与它们相同。不要照搬截图里的角色、界面或标注。 杂货铺应明显横向延展：设计为低矮、宽面阔的临街店铺，屋顶与立面组织要与面包店的大山墙、木工铺的错落工棚明显不同。一条宽阔连续的布质遮阳棚沿着门面水平伸展，覆盖店前的多个展示区域；棚下排列不同高度的货架、浅摊台、箱筐，摆放日用瓶罐、篮子、布卷、生活杂货等，货物种类丰富但用清晰简洁的像素色块，且让展示区有足够横向空间，不挤成一堆。入口清晰，留出自然通行区域；建筑可加入易辨识的篮子图案招牌，不要文字。色调与游戏协调但有自身识别度，造型朴素自然、适合小镇日常经营。 单张完整店铺外观与棚下陈设，画面不裁切、四周留白，斜俯视游戏地图视角，像素素材风格；不要现实照片、复杂插画、多视图、人物、文字、UI、边框。图是设计参考，不是最终地图或建筑素材。
