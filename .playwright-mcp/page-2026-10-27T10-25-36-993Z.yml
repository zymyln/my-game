                                                                            - generic: 请直接生成《循环小镇》旧城区普通老奶奶NPC的正面静止像素小人。上传图是同游戏的面包店老板，仅参考像素颗粒、Q版大头短身比例、轻微俯视视角、画风和站姿；不要复制人物脸、发型、厨师帽或围裙。 设计候选：慈祥平凡的老奶奶，灰白头发简单盘起，穿褪色的灰蓝色朴素上衣、灰棕长裙和旧平底鞋，一件褪色的暖灰色披肩。衣服洗旧，边缘略磨损，一两处朴素补丁，整洁但显得穿了很多年；不要破烂乞丐或悲惨夸张造型。年龄主要靠灰发和轮廓呈现，细节简洁，适合游戏中小尺寸辨认。单人全身正面安静站立，双手自然垂放、双脚着地，四周留白。透明背景，不画环境、道具、柜台、文字、边框、阴影、其他人物和其他方向。
