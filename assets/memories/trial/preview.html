<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>瓶中的幸福 · 三张试稿</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#142524;color:#eee9dc}
*{box-sizing:border-box}body{margin:0;padding:32px 20px 40px}main{max-width:1120px;margin:auto}
header{display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin-bottom:18px}h1{font-family:Georgia,"SimSun",serif;font-size:25px;font-weight:400;margin:0}header span{font-size:12px;color:#b7c4b7}
.stage{width:100%;aspect-ratio:16/9;border:1px solid #ffffff25;padding:0;display:block;position:relative;overflow:hidden;background:#1e322f;cursor:pointer;color:inherit;border-radius:4px}
.stage img{display:block;width:100%;height:100%;object-fit:contain}.caption{position:absolute;inset:auto 0 0;padding:58px 20px 26px;background:linear-gradient(transparent,#0a1919e8);text-align:center;pointer-events:none}
.caption small{font-size:10px;letter-spacing:4px;color:#dedec7}.caption p{font-family:Georgia,"SimSun",serif;font-size:clamp(16px,2.2vw,26px);line-height:1.7;letter-spacing:2px;margin:9px 0 0;text-shadow:0 1px 5px #000}
button{font:inherit}button:focus-visible{outline:3px solid #f4d18e;outline-offset:4px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 25px}.toolbar button{background:#29413b;color:inherit;border:1px solid #ffffff30;border-radius:3px;padding:10px 18px;cursor:pointer}.toolbar button:disabled{opacity:.35;cursor:default}.count{font-size:13px;letter-spacing:3px;color:#bfcbbd}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.choice{border:1px solid #ffffff20;background:#1b302c;color:#c2cbbb;padding:0 0 10px;cursor:pointer;border-radius:3px;overflow:hidden}.choice img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;margin-bottom:9px}.choice[aria-pressed="true"]{border-color:#f2d59c;color:#f2d59c}.note{font-size:12px;line-height:1.9;color:#aebcb0;margin-top:22px}.note a{color:#dfcc9b}
@media(max-width:600px){body{padding:20px 12px}header{display:block}header span{display:block;margin-top:9px}.caption{padding:28px 10px 12px}.caption p{letter-spacing:0}.caption small{font-size:8px}.choices{gap:8px}.choice{font-size:11px}.toolbar{margin-top:12px}h1{font-size:22px}}
</style>
<main>
<header><h1>瓶中的幸福</h1><span>前三段插画试稿 · 2026.10.17</span></header>
<button class="stage" id="stage" type="button" aria-label="点击画面，查看下一段幸福">
  <img id="picture" src="memory_01_birth.png" alt="父母温柔地望着襁褓中的新生儿">
  <span class="caption"><small>瓶中的幸福</small><p id="text" aria-live="polite">小孩诞生时，感受到的幸福。</p></span>
</button>
<nav class="toolbar" aria-label="切换记忆"><button id="previous" type="button" disabled>上一张</button><span id="count" class="count">01 / 03</span><button id="next" type="button">下一张 →</button></nav>
<div class="choices" aria-label="选择试稿">
  <button class="choice" type="button" data-index="0" aria-pressed="true"><img src="memory_01_birth.png" alt="">01 · 孩子诞生</button>
  <button class="choice" type="button" data-index="1" aria-pressed="false"><img src="memory_02_vista.png" alt="">02 · 壮丽景色</button>
  <button class="choice" type="button" data-index="2" aria-pressed="false"><img src="memory_03_walk.png" alt="">03 · 恋人漫步</button>
</div>
<p class="note">点击大图或按空格、→ 切换；按 ← 返回。此页用于比较画风及图文搭配，主线仍保留现有六段文字演出。<br>三张原图与<a href="prompts.json">完整生成提示词</a>均已归档。本组采用内置 image_gen 生成，画中为匿名人物的幸福记忆。</p>
</main>
<script>
const memories=[
  {file:'memory_01_birth.png',text:'小孩诞生时，感受到的幸福。',alt:'父母温柔地望着襁褓中的新生儿'},
  {file:'memory_02_vista.png',text:'目睹壮丽景色时，感受到的幸福。',alt:'旅人站在山崖上，眺望阳光下的山谷与湖泊'},
  {file:'memory_03_walk.png',text:'与恋人一同漫步的幸福。',alt:'恋人牵着手，在落日下的河畔小路漫步'}
];
let current=0;
const picture=document.querySelector('#picture'),text=document.querySelector('#text'),previous=document.querySelector('#previous'),next=document.querySelector('#next'),count=document.querySelector('#count'),choices=[...document.querySelectorAll('.choice')];
function show(index){
  current=Math.max(0,Math.min(memories.length-1,index));
  const memory=memories[current];
  picture.src=memory.file;picture.alt=memory.alt;text.textContent=memory.text;
  count.textContent=`${String(current+1).padStart(2,'0')} / 03`;
  previous.disabled=current===0;next.textContent=current===memories.length-1?'再看一遍 ↻':'下一张 →';
  choices.forEach((choice,index)=>choice.setAttribute('aria-pressed',String(index===current)));
}
function advance(){show((current+1)%memories.length)}
document.querySelector('#stage').addEventListener('click',advance);
next.addEventListener('click',advance);previous.addEventListener('click',()=>show(current-1));
choices.forEach(choice=>choice.addEventListener('click',()=>show(Number(choice.dataset.index))));
document.addEventListener('keydown',event=>{
  if(event.altKey||event.ctrlKey||event.metaKey||event.repeat)return;
  if(event.code==='ArrowRight'||event.code==='Space'){event.preventDefault();advance()}
  else if(event.code==='ArrowLeft'){event.preventDefault();show(current-1)}
});
</script>
</html>
