<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>伊蕾娜 · 骑扫帚像素试作</title>
<style>
.angle-buttons{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.angle-buttons button[aria-pressed="true"]{background:#526c49;color:#fff9e8;border-color:#526c49}
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#30453a;background:#f3f0e6}*{box-sizing:border-box}body{margin:0;padding:28px 18px}main{max-width:1080px;margin:auto}h1{font:400 26px Georgia,"SimSun",serif;letter-spacing:3px;margin:0 0 12px}.intro{font-size:13px;line-height:1.8;color:#77816d;margin:0 0 24px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:22px}.scene-wrap{position:relative;border:5px solid #fdfcf5;border-radius:5px;box-shadow:0 0 0 1px #bbc5b5;overflow:hidden;background:#8eac78}canvas{display:block;image-rendering:pixelated;max-width:100%}#scene{width:100%;height:auto;aspect-ratio:16/9}.badge{position:absolute;left:12px;top:12px;padding:6px 9px;background:#f7f4e5e8;font-size:11px;color:#576b51}.controls{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}button{font:inherit;font-size:12px;border:1px solid #a8b69c;border-radius:3px;background:#e4e8d8;color:#42583b;padding:9px 13px;cursor:pointer}button:focus-visible{outline:3px solid #a98d4b;outline-offset:3px}button:disabled{opacity:.5;cursor:default}.detail{background:#e6e5dc;border:1px solid #c4cbbb;border-radius:4px;padding:16px}h2{font-size:13px;font-weight:500;margin:0 0 15px}.detail canvas{width:224px;height:168px;background-color:#efeee9;background-image:conic-gradient(#d9dbd3 25%,transparent 0 50%,#d9dbd3 0 75%,transparent 0);background-size:20px 20px}.detail p{font-size:11px;line-height:1.9;color:#75816f}.note{font-size:12px;line-height:1.9;color:#7a8270;margin-top:22px}a{color:#8b743c}.status{font-size:11px;color:#72816b;margin-top:12px;min-height:1.7em}@media(max-width:760px){.layout{grid-template-columns:1fr}.detail{display:grid;grid-template-columns:1fr 1fr;gap:12px}.detail h2{grid-column:1/-1;margin:0}.detail canvas{width:100%;height:auto}.detail p{margin:0}h1{font-size:22px}.badge{font-size:9px;top:7px;left:7px}body{padding:20px 12px}}
</style>
<main>
<h1>伊蕾娜 · 掠过草地</h1>
<p class="intro">骑扫帚的像素试作。先看小尺寸造型，以及低空滑行、轻微起伏和脚下影子的效果。</p>
<div class="layout"><section>
<div class="scene-wrap"><canvas id="scene" width="640" height="360" aria-label="伊蕾娜骑扫帚贴近草地飞行的动态预览"></canvas><span class="badge">游戏比例 · 低空滑行</span></div>
<div class="angle-buttons" aria-label="选择飞行朝向"><button type="button" data-facing="front" aria-pressed="false" disabled>正面 ↓</button><button type="button" data-facing="back" aria-pressed="false" disabled>背面 ↑</button><button type="button" data-facing="left" aria-pressed="false" disabled>左侧 ←</button><button type="button" data-facing="right" aria-pressed="true" disabled>右侧 →</button></div>
<div class="controls"><button id="pause" type="button" disabled>暂停</button><button id="replay" type="button" disabled>重新飞入</button><button id="direction" type="button" disabled>切换朝向</button></div>
<p id="status" class="status" aria-live="polite">正在载入试作…</p>
</section><aside class="detail"><h2 id="detail-title">右侧骑姿</h2><canvas id="detail" width="224" height="168" aria-label="骑扫帚小人的放大像素轮廓"></canvas><p>银白长发、紫眼睛、粉色帽带、黑色披风。<br>小人在游戏画布上占 64×48 像素，漂浮高度约 10 像素；四向可切换，停下后仍轻微悬浮。<br>方向键选择朝向，空格暂停。</p></aside></div>
<p class="note">此页是造型与移动试作，当前主线保持原状。可以直接双击此 HTML 离线观看。<br><a href="elaina_broom_front_source.png">正面原图</a> · <a href="elaina_broom_back_source.png">背面原图</a> · <a href="elaina_broom_source.png">侧面原图</a> · <a href="pose-reference.png">姿势参考</a> · <a href="directions-generation.json">正背面生成提示词</a></p>
</main>
<script>
const scene=document.querySelector('#scene'),ctx=scene.getContext('2d'),detail=document.querySelector('#detail'),detailCtx=detail.getContext('2d');
const pause=document.querySelector('#pause'),replay=document.querySelector('#replay'),directionButton=document.querySelector('#direction'),status=document.querySelector('#status');
ctx.imageSmoothingEnabled=false;detailCtx.imageSmoothingEnabled=false;
const frames=new Map(),angleButtons=[...document.querySelectorAll('button[data-facing]')],labels={right:'右侧',left:'左侧',front:'正面',back:'背面'};
const origins={right:{x:70,y:245},left:{x:570,y:245},front:{x:281,y:170},back:{x:281,y:330}};
let ready=false,paused=matchMedia('(prefers-reduced-motion: reduce)').matches,clock=0,last=0,facing='right',entry=0;
const background=new Image();
function load(image,path){return new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=()=>reject(new Error('无法读取 '+path));image.src=path})}
function draw(){
  if(!ready)return;
  ctx.clearRect(0,0,640,360);ctx.drawImage(background,0,0,640,360);
  const progress=Math.min(entry/4200,1),ease=1-Math.pow(1-progress,3),origin=origins[facing],x=origin.x+(281-origin.x)*ease,ground=origin.y+(245-origin.y)*ease;
  const sprite=frames.get(facing==='left'?'right':facing),flip=facing==='left'?-1:1;
  const bob=Math.round(Math.sin(clock/420)),lift=10+bob;
  const groundY=Math.round(ground);
  ctx.fillStyle='#2e403340';ctx.fillRect(Math.round(x)-19,groundY-1,38,3);ctx.fillRect(Math.round(x)-14,groundY-2,28,1);ctx.fillRect(Math.round(x)-14,groundY+2,28,1);
  ctx.save();ctx.translate(Math.round(x),groundY-lift);ctx.scale(flip,1);ctx.drawImage(sprite,-32,-48);ctx.restore();
  detailCtx.clearRect(0,0,224,168);detailCtx.save();detailCtx.translate(flip===1?0:224,0);detailCtx.scale(flip,1);detailCtx.drawImage(sprite,0,0,224,168);detailCtx.restore();
  scene.dataset.phase=progress<1?'arriving':'hovering';scene.dataset.time=Math.round(clock);scene.dataset.x=Math.round(x);scene.dataset.y=groundY;scene.dataset.height=lift;scene.dataset.facing=facing;scene.dataset.paused=String(paused);
}
function sync(){pause.textContent=paused?'继续飞行':'暂停';pause.setAttribute('aria-pressed',String(paused));directionButton.textContent='切换朝向';document.querySelector('#detail-title').textContent=labels[facing]+'骑姿';angleButtons.forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.facing===facing)));const motion={right:'从左侧向右滑入',left:'从右侧向左滑入',front:'朝屏幕方向飞来',back:'背向屏幕飞去'}[facing];status.textContent=paused?'已暂停，画面停留在当前位置。':motion+'，随后轻轻悬浮。';draw()}
function choose(direction){facing=direction;entry=0;last=0;sync()}
pause.addEventListener('click',()=>{paused=!paused;sync()});replay.addEventListener('click',()=>{entry=0;clock=0;paused=false;last=0;sync()});directionButton.addEventListener('click',()=>{const order=['right','front','left','back'];choose(order[(order.indexOf(facing)+1)%4])});
angleButtons.forEach(button=>button.addEventListener('click',()=>choose(button.dataset.facing)));
document.addEventListener('keydown',event=>{if(event.repeat||!ready||event.altKey||event.ctrlKey||event.metaKey)return;const directions={ArrowDown:'front',ArrowUp:'back',ArrowLeft:'left',ArrowRight:'right'};if(event.code==='Space'){event.preventDefault();paused=!paused;sync()}else if(directions[event.code]){event.preventDefault();choose(directions[event.code])}});
function frame(time){const elapsed=last?Math.min(time-last,50):0;last=time;if(ready&&!paused&&!document.hidden){clock+=elapsed;entry+=elapsed;draw()}requestAnimationFrame(frame)}
async function loadSprite(direction,file){const image=new Image();await load(image,file);const sprite=document.createElement('canvas');sprite.width=64;sprite.height=48;const context=sprite.getContext('2d');context.imageSmoothingEnabled=false;context.drawImage(image,0,0,64,48);frames.set(direction,sprite)}
Promise.all([load(background,'grass-preview.png'),loadSprite('right','elaina_broom_source.png'),loadSprite('front','elaina_broom_front_source.png'),loadSprite('back','elaina_broom_back_source.png')]).then(()=>{ready=true;for(const button of[pause,replay,directionButton,...angleButtons])button.disabled=false;sync();requestAnimationFrame(frame)}).catch(error=>{status.textContent=error.message});
</script>
</html>
