<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>伊蕾娜 · 站立差分校对</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f0e6;color:#35483e;font:14px 'Microsoft YaHei',sans-serif}main{max-width:1300px;margin:auto;padding:28px}h1{font:25px SimSun,serif;letter-spacing:3px}p{color:#7a826c;line-height:1.8}button,select{padding:8px 13px;border:1px solid #bdc5ad;border-radius:4px;background:#fffdf4;color:#415a43;font:inherit;cursor:pointer}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:20px 0}.stage{height:min(68vh,680px);min-height:400px;position:relative;border:1px solid #b8c2ad;border-radius:5px;overflow:hidden;display:grid;place-items:center}.checker{background-color:#eee;background-image:linear-gradient(45deg,#d1d1d1 25%,transparent 25%,transparent 75%,#d1d1d1 75%),linear-gradient(45deg,#d1d1d1 25%,transparent 25%,transparent 75%,#d1d1d1 75%);background-size:28px 28px;background-position:0 0,14px 14px}.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.stage span{position:absolute;top:15px;left:15px;background:#fffef1e8;border:1px solid #ccc;padding:6px 12px;border-radius:4px}.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:20px}.strip button{padding:10px;background:#fcfaf2}.strip button[aria-pressed=true]{outline:2px solid #7a916a}.strip img{width:100%;height:190px;object-fit:contain;display:block;margin-bottom:8px}.note{font-size:12px}button:focus-visible,select:focus-visible{outline:3px solid #a68b54}@media(max-width:650px){main{padding:16px}.strip{gap:5px}.strip img{height:100px}.strip button{padding:5px;font-size:11px}.stage{height:62vh}}
</style><main>
<h1>伊蕾娜 · 站立差分校对</h1><p>2026-10-17 发色更新版。新原图与旧游戏版均已单独备份，可切换背景比较五表情。</p>
<div class="controls"><label>背景 <select id="background"><option value="checker">透明棋盘</option><option value="#f8f4e8">浅色</option><option value="#233c39">深色</option><option value="#abc390">草原绿</option></select></label><button id="cycle" type="button" aria-pressed="false">连续切换</button></div>
<div id="stage" class="stage checker"><img id="current" src="elaina_standing.png" alt="伊蕾娜平常表情"><span id="label">平常</span></div><div class="strip" id="strip"></div>
<p class="note">处理版统一为 1024 × 1536 透明 PNG。AI 处理可能对线条与局部细节产生细微变化，请以原图和本预览比较；本版已替换游戏中的站立五表情，其他姿势保持原状。</p>
</main><script>
const faces=[['平常','elaina_standing.png'],['微笑','elaina_standing_smile.png'],['无语','elaina_standing_blank.png'],['惊讶','elaina_standing_surprised.png'],['正色','elaina_standing_serious.png']];let index=0,timer=0;
const strip=document.getElementById('strip'),current=document.getElementById('current');
function show(i){index=i;current.src=faces[i][1];current.alt=`伊蕾娜${faces[i][0]}表情`;document.getElementById('label').textContent=faces[i][0];[...strip.children].forEach((button,k)=>button.setAttribute('aria-pressed',String(k===i)));}
faces.forEach(([name,file],i)=>{const button=document.createElement('button');button.type='button';button.innerHTML=`<img src="${file}" alt="">${name}`;button.onclick=()=>show(i);strip.append(button);});show(0);
document.getElementById('background').onchange=event=>{const stage=document.getElementById('stage');stage.classList.toggle('checker',event.target.value==='checker');stage.style.backgroundColor=event.target.value==='checker'?'':event.target.value;};
document.getElementById('cycle').onclick=event=>{if(timer){clearInterval(timer);timer=0;}else timer=setInterval(()=>show((index+1)%faces.length),1100);event.currentTarget.textContent=timer?'停止切换':'连续切换';event.currentTarget.setAttribute('aria-pressed',String(Boolean(timer)));};
</script></html>
