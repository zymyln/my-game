<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>角色立绘校对</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eeeade;color:#2d403a;font:15px system-ui}main{max-width:1100px;margin:auto;padding:20px}h1{font-size:22px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}button,select{padding:9px;border:1px solid #aab8a5;background:#faf8ef;color:inherit;border-radius:4px}button[aria-pressed=true]{background:#405e4d;color:white}.stage{height:min(76vh,850px);position:relative;background-color:#e8e8e8;background-image:conic-gradient(#ccc 25%,transparent 0 50%,#ccc 0 75%,transparent 0);background-size:24px 24px;border:1px solid #afb6a4}.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}p{line-height:1.7}
</style>
<main><h1>角色立绘 · 原图另行保留</h1><label>校对底色 <select id="background"><option value="checker">棋盘</option><option value="#fbf7ee">浅色</option><option value="#263a39">深色</option><option value="#a3bf89">草原绿</option></select></label><nav id="choices"></nav><div class="stage"><img id="portrait" alt=""></div><p id="caption"></p><p>处理版使用内置 imagegen，可能有细微线条变化。妮诺新版四张已接入游戏；旧六张标为历史版，保留备查。村长“不耐烦”已登记预留。</p></main>
<script>
const files=[['妮诺·支线迟疑','branch-expressions/processed/nino_hesitant.png'],['艾米尔·支线决心','branch-expressions/processed/emil_determined.png'],['伊蕾娜·平常','elaina/standing/elaina_standing.png'],['伊蕾娜·微笑','elaina/standing/elaina_standing_smile.png'],['伊蕾娜·无语','elaina/standing/elaina_standing_blank.png'],['伊蕾娜·惊讶','elaina/standing/elaina_standing_surprised.png'],['伊蕾娜·正色','elaina/standing/elaina_standing_serious.png'],['伊蕾娜·扶帽','elaina/poses/elaina_confident.png'],['伊蕾娜·思考','elaina/poses/elaina_thinking.png'],['伊蕾娜·摊手','elaina/poses/elaina_explaining.png'],['村长·平静','chief/processed/chief_calm.png'],['村长·不耐烦','chief/processed/chief_impatient.png'],['村长·愤怒','chief/processed/chief_angry.png'],['妮诺·旧版·平常','nino/processed/nino_down.png'],['妮诺·旧版·害怕','nino/processed/nino_flustered.png'],['妮诺·旧版·惊恐','nino/processed/nino_terrified.png'],['妮诺·旧版·流泪','nino/processed/nino_teary.png'],['妮诺·旧版·微笑','nino/processed/nino_smiletiny.png'],['妮诺·旧版·空洞','nino/processed/nino_empty.png'],['艾米尔·平常','emil/processed/emil_neutral.png'],['艾米尔·沮丧','emil/processed/emil_down.png'],['艾米尔·灿烂','emil/processed/emil_bright.png'],['妮诺·新版正常','nino/processed-v2/nino_down.png'],['妮诺·新版微笑','nino/processed-v2/nino_smiletiny.png'],['妮诺·新版哭泣','nino/processed-v2/nino_teary.png'],['妮诺·新版空洞','nino/processed-v2/nino_empty.png']];
const image=document.querySelector('#portrait'),choices=document.querySelector('#choices');
files.forEach(([label,path],index)=>{const button=document.createElement('button');button.textContent=label;button.onclick=()=>{image.src=path;image.alt=label;document.querySelector('#caption').textContent=label+' — '+path;for(const other of choices.children)other.setAttribute('aria-pressed',String(other===button));};choices.append(button);if(index===0)button.click();});
document.querySelector('#background').onchange=event=>{const stage=document.querySelector('.stage');stage.style.backgroundImage=event.target.value==='checker'?'':'none';stage.style.backgroundColor=event.target.value==='checker'?'#e8e8e8':event.target.value;};
</script></html>
