<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>角色立绘校对</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eeeade;color:#2d403a;font:15px system-ui}main{max-width:1100px;margin:auto;padding:20px}h1{font-size:22px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}button,select{padding:9px;border:1px solid #aab8a5;background:#faf8ef;color:inherit;border-radius:4px}button[aria-pressed=true]{background:#405e4d;color:white}.stage{height:min(76vh,850px);position:relative;background-color:#e8e8e8;background-image:conic-gradient(#ccc 25%,transparent 0 50%,#ccc 0 75%,transparent 0);background-size:24px 24px;border:1px solid #afb6a4}.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}p{line-height:1.7}
</style>
<main><h1>角色立绘 · 原图另行保留</h1><label>校对底色 <select id="background"><option value="checker">棋盘</option><option value="#fbf7ee">浅色</option><option value="#263a39">深色</option><option value="#a3bf89">草原绿</option></select></label><nav id="choices"></nav><div class="stage"><img id="portrait" alt=""></div><p id="caption"></p><p>处理版使用内置 imagegen，可能有细微线条变化。当前主线尚未使用村长“不耐烦”标记。</p></main>
<script>
const files=[['伊蕾娜·平常','elaina/standing/elaina_standing.png'],['伊蕾娜·微笑','elaina/standing/elaina_standing_smile.png'],['伊蕾娜·无语','elaina/standing/elaina_standing_blank.png'],['伊蕾娜·惊讶','elaina/standing/elaina_standing_surprised.png'],['伊蕾娜·正色','elaina/standing/elaina_standing_serious.png'],['伊蕾娜·扶帽','elaina/poses/elaina_confident.png'],['伊蕾娜·思考','elaina/poses/elaina_thinking.png'],['伊蕾娜·摊手','elaina/poses/elaina_explaining.png'],['村长·平静','chief/processed/chief_calm.png'],['村长·不耐烦','chief/processed/chief_impatient.png'],['村长·愤怒','chief/processed/chief_angry.png']];
const image=document.querySelector('#portrait'),choices=document.querySelector('#choices');
files.forEach(([label,path],index)=>{const button=document.createElement('button');button.textContent=label;button.onclick=()=>{image.src=path;image.alt=label;document.querySelector('#caption').textContent=label+' — '+path;for(const other of choices.children)other.setAttribute('aria-pressed',String(other===button));};choices.append(button);if(index===0)button.click();});
document.querySelector('#background').onchange=event=>{const stage=document.querySelector('.stage');stage.style.backgroundImage=event.target.value==='checker'?'':'none';stage.style.backgroundColor=event.target.value==='checker'?'#e8e8e8':event.target.value;};
</script></html>
